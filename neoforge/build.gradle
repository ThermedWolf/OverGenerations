plugins {
    id 'net.neoforged.moddev' version "${modDevGradleVersion}"
}

version = project.modVersion
group = project.modGroup

base {
    archivesName = "OverGenerations-NeoForge-${project.minecraftVersion}"
}

// Shared code and data are compiled straight into every loader jar so there is
// exactly one source of truth (Minecraft uses Mojang mappings on both loaders).
sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

neoForge {
    version = project.neoForgeVersion

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.modId}" {
            sourceSet sourceSets.main
        }
    }
}

// Expands ${...} tokens in the mods.toml template into generated resources.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : project.minecraftVersion,
            minecraft_version_range: '[26.3]',
            neo_version            : project.neoForgeVersion,
            mod_id                 : project.modId,
            mod_name               : project.modName,
            mod_license            : 'MIT',
            mod_version            : project.modVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.javaToolchainVersion as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
