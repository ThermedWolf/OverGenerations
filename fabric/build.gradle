plugins {
    id 'net.fabricmc.fabric-loom' version "${loomVersion}"
}

version = project.modVersion
group = project.modGroup

base {
    archivesName = "OverGenerations-Fabric-${project.minecraftVersion}"
}

// Shared code and data are compiled straight into every loader jar so there is
// exactly one source of truth (Minecraft uses Mojang mappings on both loaders).
sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))
sourceSets.test.java.srcDir(rootProject.file('common/src/test/java'))

dependencies {
    // Minecraft 26.3 ships unobfuscated, so no mappings are needed.
    minecraft "com.mojang:minecraft:${project.minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${project.fabricLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabricApiVersion}"

    // MixinExtras is bundled with the loader at runtime; compile-only here.
    compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinExtrasVersion}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${project.mixinExtrasVersion}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'org.slf4j:slf4j-api:2.0.20'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    var replaceProperties = [
            mod_id : project.modId,
            version: project.modVersion,
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand replaceProperties
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.javaToolchainVersion as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
